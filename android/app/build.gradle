android {
    // ... your standard compile SDK setups ...

    defaultConfig {
        applicationId "com.dash_videoeditor"
        // ... minSdk and targetSdk details ...

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
